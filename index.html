<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - หน้าแรก</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* เอฟเฟกต์อนุภาคระยิบระยับ */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                        radial-gradient(3px 3px at 80px 120px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 150px 200px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: sparkle 4s linear infinite;
        }

        .main-card {
            width: 100%;
            max-width: 950px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.6);
            padding: 60px 40px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: cardAppear 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* รูปภาพเว่อร์วัง */
        .profile-container {
            position: relative;
            width: 290px;
            height: 290px;
            margin: 0 auto 35px auto;
            animation: float 4s ease-in-out infinite;
        }

        .profile-container::before {
            content: '';
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8, #ff007f);
            background-size: 300% 300%;
            border-radius: 50%;
            z-index: 1;
            filter: blur(25px);
            opacity: 0.9;
            animation: glowRotate 5s linear infinite;
        }

        .profile-box {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(135deg, #ffffff, #ff758c, #764ba2);
            z-index: 2;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(255, 0, 128, 0.4);
        }

        .profile-img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: all 0.5s ease;
        }

        .profile-container:hover .profile-box {
            transform: scale(1.12) rotate(5deg);
            box-shadow: 0 25px 60px rgba(255, 0, 128, 0.7);
        }

        .profile-container:hover .profile-img {
            transform: scale(1.08);
        }

        /* ข้อความนีออนและปุ่ม */
        .greeting-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ffe6ed, #fff0f5);
            color: #ff007f;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 10px 30px;
            border-radius: 30px;
            border: 2px solid #ff758c;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.3);
            animation: pulse 2s infinite;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.4rem;
            color: #4a4a4a;
            font-weight: 600;
            margin-bottom: 40px;
        }

        .btn-start {
            position: relative;
            display: inline-block;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: 800;
            padding: 20px 60px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #ffffff;
            box-shadow: 0 15px 35px rgba(121, 40, 202, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            border: 2px solid #ffffff;
        }

        .btn-start:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 25px 50px rgba(255, 0, 128, 0.6);
            letter-spacing: 2px;
        }

        /* Keyframes แอนิเมชัน */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes glowRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes sparkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        @media (max-width: 600px) {
            .profile-container { width: 220px; height: 220px; }
            .main-title { font-size: 2.3rem; }
            .btn-start { padding: 15px 40px; font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="main-card">
        <div class="profile-container">
            <div class="profile-box">
                <img src="มุกค่ะอิอิ.jpg" alt="Profile Image" class="profile-img">
            </div>
        </div>

        <span class="greeting-tag">✨ WELCOME TO MY PORTFOLIO ✨</span>
        <h1 class="main-title">ณัฐธิดา ถกลพัฒนกุล</h1>
        <p class="subtitle">โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</p>

        <a href="about.html" class="btn-start">เข้าสู่เว็บไซต์ &rarr;</a>
    </div>

</body>
</html>
