<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - หน้าแรก</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 40%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .main-card {
            width: 100%;
            max-width: 950px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            padding: 60px 40px;
            text-align: center;
            position: relative;
        }

        /* Container รูปภาพใหญ่เด่น */
        .profile-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 35px auto;
            animation: float 4s ease-in-out infinite;
        }

        /* แสงออร่าด้านหลังรูป */
        .profile-container::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            background: linear-gradient(45deg, #ff3366, #ff85a2, #764ba2, #ff3366);
            background-size: 400% 400%;
            border-radius: 50%;
            z-index: 1;
            filter: blur(20px);
            opacity: 0.85;
            animation: glowRotate 8s linear infinite;
        }

        /* กรอบวงกลมครอบรูป */
        .profile-box {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(135deg, #ffffff, #ffccd5, #764ba2);
            z-index: 2;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(255, 51, 102, 0.3);
        }

        /* รูปภาพข้างใน */
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            transition: all 0.5s ease;
        }

        /* เอฟเฟคลำแสงวิ่งผ่านรูป */
        .profile-box::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.6) 100%
            );
            transform: rotate(30deg);
            transition: all 0.8s ease;
            opacity: 0;
            pointer-events: none;
        }

        /* Hover Effect สวมบทบาทเมื่อเอาเมาส์ชี้ */
        .profile-container:hover {
            animation-play-state: paused;
        }

        .profile-container:hover .profile-box {
            transform: scale(1.08) rotate(3deg);
            box-shadow: 0 25px 50px rgba(255, 51, 102, 0.5);
        }

        .profile-container:hover .profile-box::after {
            left: 130%;
            opacity: 1;
        }

        .profile-container:hover .profile-img {
            transform: scale(1.05);
        }

        /* ข้อความและปุ่ม */
        .greeting-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ffe6ed, #fff0f5);
            color: #ff3366;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 8px 25px;
            border-radius: 30px;
            border: 2px solid #ffccd5;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .main-title {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff3366, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.4rem;
            color: #4a4a4a;
            font-weight: 600;
            margin-bottom: 40px;
        }

        .btn-start {
            display: inline-block;
            text-decoration: none;
            font-size: 1.35rem;
            font-weight: 700;
            padding: 18px 55px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff3366, #e91e63);
            color: #ffffff;
            box-shadow: 0 12px 30px rgba(233, 30, 99, 0.35);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #ffffff;
        }

        .btn-start:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 20px 40px rgba(233, 30, 99, 0.5);
            background: linear-gradient(135deg, #e91e63, #ff3366);
        }

        /* Keyframes แอนิเมชัน */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-18px);
            }
        }

        @keyframes glowRotate {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @media (max-width: 600px) {
            .profile-container {
                width: 220px;
                height: 220px;
            }
            .main-title {
                font-size: 2.3rem;
            }
            .subtitle {
                font-size: 1.15rem;
            }
            .main-card {
                padding: 40px 20px;
            }
            .btn-start {
                padding: 15px 40px;
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- รูปโปรไฟล์ของคุณมุก + เอฟเฟคเรืองแสง -->
        <div class="profile-container">
            <div class="profile-box">
                <img src="มุกค่ะอิอิ.jpg" alt="Profile Image" class="profile-img">
            </div>
        </div>

        <span class="greeting-tag">✨ WELCOME TO MY PORTFOLIO ✨</span>
        <h1 class="main-title">ณัฐธิดา ถกลพัฒนกุล</h1>
        <p class="subtitle">โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</p>

        <a href="about.html" class="btn-start">เข้าสู่เว็บไซต์ &rarr;</a>
    </div>

</body>
</html>
