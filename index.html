<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 40%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .full-wrapper {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #ffffff;
        }

        .avatar-container {
            position: relative;
            margin-bottom: 25px;
        }

        .avatar-glow {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(135deg, #ffffff, #ff758c, #00f2fe);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 255, 255, 0.8);
            animation: spin-glow 6s linear infinite alternate;
        }

        @keyframes spin-glow {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ffffff;
        }

        .badge {
            background: rgba(255, 255, 255, 0.9);
            color: #ff3366;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 8px 30px;
            border-radius: 50px;
            letter-spacing: 3px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            display: inline-block;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .hero-name {
            font-size: 2.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .hero-school {
            font-size: 1.4rem;
            color: #ffe6ed;
            font-weight: 400;
            margin-bottom: 40px;
        }

        .btn-action {
            display: inline-block;
            text-decoration: none;
            background: #ffffff;
            color: #ff3366;
            font-size: 1.4rem;
            font-weight: 800;
            padding: 18px 50px;
            border-radius: 50px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-action:hover {
            transform: translateY(-5px) scale(1.05);
            background: #ff3366;
            color: #ffffff;
            box-shadow: 0 20px 40px rgba(255, 51, 102, 0.5);
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 2.8rem; }
            .hero-name { font-size: 1.6rem; }
            .avatar-glow { width: 180px; height: 180px; }
            .btn-action { width: 100%; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="full-wrapper">
        <div class="avatar-container">
            <div class="avatar-glow">
                <!-- เปลี่ยนชื่อไฟล์รูปตรงนี้แล้วครับ -->
                <img src="มุกค่ะ.jpg" alt="รูปโปรไฟล์" class="avatar-img">
            </div>
        </div>

        <span class="badge">OFFICIAL PORTFOLIO</span>
        <h1 class="hero-title">WELCOME TO MY WORLD</h1>
        <p class="hero-name">นางสาว ณัฐธิดา ถกลพัฒนกุล</p>
        <p class="hero-school">โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</p>

        <a href="about.html" class="btn-action">เริ่มต้นรู้จักกัน &rarr;</a>
    </div>

</body>
</html>
