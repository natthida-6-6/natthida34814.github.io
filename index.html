<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยินดีต้อนรับสู่เว็บไซต์ - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        /* ==================== สไตล์เอฟเฟกต์ม่านสีแดง ==================== */
        .curtain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            pointer-events: none;
            display: flex;
            overflow: hidden;
        }

        .curtain-panel {
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, #800000, #b30000, #d90429, #800000);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            position: relative;
            animation-duration: 1.8s;
            animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1);
            animation-fill-mode: forwards;
            animation-delay: 0.3s;
        }

        .curtain-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.3) 0px,
                rgba(0, 0, 0, 0.3) 20px,
                transparent 20px,
                transparent 40px
            );
        }

        .curtain-left {
            animation-name: openCurtainLeft;
            border-right: 3px solid #ffb3b3;
        }

        .curtain-right {
            animation-name: openCurtainRight;
            border-left: 3px solid #ffb3b3;
        }

        @keyframes openCurtainLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        @keyframes openCurtainRight {
            0% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }

        /* ==================== สไตล์หน้าเว็บหลัก ==================== */
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                        radial-gradient(3px 3px at 80px 120px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: sparkle 4s linear infinite;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 50px rgba(255, 0, 128, 0.35);
            padding: 60px 40px;
            text-align: center;
            max-width: 650px;
            width: 100%;
            animation: cardAppear 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 1;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: #444;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .btn-enter {
            display: inline-block;
            font-size: 1.35rem;
            font-weight: 800;
            padding: 18px 50px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #ffffff;
            text-decoration: none;
            border: 2px solid #ffffff;
            box-shadow: 0 10px 25px rgba(255, 0, 128, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .btn-enter:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(255, 0, 128, 0.6);
            letter-spacing: 1px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        @keyframes sparkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        @media (max-width: 600px) {
            .hero-title { font-size: 2.5rem; }
            .hero-subtitle { font-size: 1.2rem; }
            .welcome-card { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <!-- 🎭 เอฟเฟกต์ม่านสีแดงเปิดออก -->
    <div class="curtain-container">
        <div class="curtain-panel curtain-left"></div>
        <div class="curtain-panel curtain-right"></div>
    </div>

    <!-- 🎴 การ์ดแสดงผลหน้าแรก -->
    <div class="welcome-card">
        <h1 class="hero-title">WELCOME TO MY WEBSITE</h1>
        <p class="hero-subtitle">ยินดีต้อนรับเข้าสู่เว็บไซต์ประวัติส่วนตัวและผลงาน</p>
        
        <!-- ปุ่มกดเชื่อมต่อไปยังไฟล์ที่ 2 (portfolio.html) -->
        <a href="portfolio.html" class="btn-enter">เข้าสู่เว็บไซต์ ✨</a>
    </div>

</body>
</html>
