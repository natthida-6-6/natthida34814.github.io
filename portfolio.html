<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - ผลงานทั้งหมด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 40%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .full-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            border: 2px solid #ffffff;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            padding: 50px 40px;
        }

        .page-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff3366, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .page-subtitle {
            text-align: center;
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* ตารางรูปภาพ 3 คอลัมน์ (บน 3 ล่าง 3) */
        .gallery-grid {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 35px;
            min-height: 480px;
        }

        .gallery-grid.active {
            display: grid;
        }

        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 2px solid #ffccd5;
            aspect-ratio: 4 / 3;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gallery-item:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ff3366;
            box-shadow: 0 15px 30px rgba(255, 51, 102, 0.25);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ปุ่มสลับหน้า */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: #ffffff;
            border: 2px solid #ff3366;
            color: #ff3366;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .page-btn.active, .page-btn:hover {
            background: #ff3366;
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-back {
            display: inline-block;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 16px 50px;
            border-radius: 50px;
            background: #ffffff;
            color: #ff3366;
            border: 3px solid #ff3366;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-back:hover {
            background: #ff3366;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 51, 102, 0.4);
        }

        /* Modal ซูมดูรูปใหญ่ */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .full-wrapper { padding: 30px 15px; }
            .page-title { font-size: 2.5rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        }

        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="full-wrapper">
        <h1 class="page-title">MY PORTFOLIO</h1>
        <p class="page-subtitle">รวมผลงานและเกียรติบัตรทั้งหมด (หน้าละ 6 ใบ)</p>

        <!-- หน้าที่ 1 (ใบที่ 1 - 6) -->
        <div class="gallery-grid active" id="page-1">
            <div class="gallery-item" onclick="openModal('บัตร 1.jpg')"><img src="บัตร 1.jpg" alt="บัตร 1"></div>
            <div class="gallery-item" onclick="openModal('บัตร 2.jpg')"><img src="บัตร 2.jpg" alt="บัตร 2"></div>
            <div class="gallery-item" onclick="openModal('บัตร 4.jpg')"><img src="บัตร 4.jpg" alt="บัตร 4"></div>
            <div class="gallery-item" onclick="openModal('บัตร 5.jpg')"><img src="บัตร 5.jpg" alt="บัตร 5"></div>
            <div class="gallery-item" onclick="openModal('บัตร 6.jpg')"><img src="บัตร 6.jpg" alt="บัตร 6"></div>
            <div class="gallery-item" onclick="openModal('พอด 1.jpg')"><img src="พอด 1.jpg" alt="พอด 1"></div>
        </div>

        <!-- หน้าที่ 2 (ใบที่ 7 - 12) -->
        <div class="gallery-grid" id="page-2">
            <div class="gallery-item" onclick="openModal('พอด 2.jpg')"><img src="พอด 2.jpg" alt="พอด 2"></div>
            <div class="gallery-item" onclick="openModal('พอด 3.jpg')"><img src="พอด 3.jpg" alt="พอด 3"></div>
            <div class="gallery-item" onclick="openModal('พอด 4.jpg')"><img src="พอด 4.jpg" alt="พอด 4"></div>
            <div class="gallery-item" onclick="openModal('พอด 5.jpg')"><img src="พอด 5.jpg" alt="พอด 5"></div>
            <div class="gallery-item" onclick="openModal('พอด 6.jpg')"><img src="พอด 6.jpg" alt="พอด 6"></div>
            <div class="gallery-item" onclick="openModal('พอด 7.jpg')"><img src="พอด 7.jpg" alt="พอด 7"></div>
        </div>

        <!-- หน้าที่ 3 (ใบที่ 13 - 18) -->
        <div class="gallery-grid" id="page-3">
            <div class="gallery-item" onclick="openModal('พอด 8.jpg')"><img src="พอด 8.jpg" alt="พอด 8"></div>
            <div class="gallery-item" onclick="openModal('พอด 9.jpg')"><img src="พอด 9.jpg" alt="พอด 9"></div>
            <div class="gallery-item" onclick="openModal('พอด 10.jpg')"><img src="พอด 10.jpg" alt="พอด 10"></div>
            <div class="gallery-item" onclick="openModal('พอด 11.jpg')"><img src="พอด 11.jpg" alt="พอด 11"></div>
            <div class="gallery-item" onclick="openModal('พอด 12.jpg')"><img src="พอด 12.jpg" alt="พอด 12"></div>
            <div class="gallery-item" onclick="openModal('พอด 13.jpg')"><img src="พอด 13.jpg" alt="พอด 13"></div>
        </div>

        <!-- หน้าที่ 4 (ใบที่ 19 - 24) -->
        <div class="gallery-grid" id="page-4">
            <div class="gallery-item" onclick="openModal('พอด 14.jpg')"><img src="พอด 14.jpg" alt="พอด 14"></div>
            <div class="gallery-item" onclick="openModal('พอด 15.jpg')"><img src="พอด 15.jpg" alt="พอด 15"></div>
            <div class="gallery-item" onclick="openModal('พอด 16.jpg')"><img src="พอด 16.jpg" alt="พอด 16"></div>
            <div class="gallery-item" onclick="openModal('พอด 17.jpg')"><img src="พอด 17.jpg" alt="พอด 17"></div>
            <div class="gallery-item" onclick="openModal('พอด 18.jpg')"><img src="พอด 18.jpg" alt="พอด 18"></div>
            <div class="gallery-item" onclick="openModal('พอด 19.jpg')"><img src="พอด 19.jpg" alt="พอด 19"></div>
        </div>

        <!-- หน้าที่ 5 (ใบที่ 25 - 26) -->
        <div class="gallery-grid" id="page-5">
            <div class="gallery-item" onclick="openModal('พอด 20.jpg')"><img src="พอด 20.jpg" alt="พอด 20"></div>
            <!-- ภาพเพิ่มเติมถ้ามี -->
            <div class="gallery-item" onclick="openModal('บัตร 3.jpg')"><img src="บัตร 3.jpg" alt="บัตร 3" onerror="this.parentElement.style.display='none'"></div>
        </div>

        <!-- ปุ่มสลับหน้า -->
        <div class="pagination">
            <button class="page-btn active" onclick="changePage(1, event)">หน้า 1</button>
            <button class="page-btn" onclick="changePage(2, event)">หน้า 2</button>
            <button class="page-btn" onclick="changePage(3, event)">หน้า 3</button>
            <button class="page-btn" onclick="changePage(4, event)">หน้า 4</button>
            <button class="page-btn" onclick="changePage(5, event)">หน้า 5</button>
        </div>

        <div class="btn-group">
            <a href="about.html" class="btn-back">&larr; ย้อนกลับไปประวัติส่วนตัว</a>
        </div>
    </div>

    <!-- Modal ซูมภาพ -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-img" id="imgFull">
    </div>

    <script>
        function changePage(pageNum, evt) {
            // ซ่อนทุกหน้า
            document.querySelectorAll('.gallery-grid').forEach(grid => {
                grid.classList.remove('active');
            });
            // เอาไฮไลต์ปุ่มเดิมออก
            document.querySelectorAll('.page-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // แสดงหน้าที่เลือก
            document.getElementById('page-' + pageNum).classList.add('active');
            // ไฮไลต์ปุ่มปัจจุบัน
            evt.target.classList.add('active');
        }

        function openModal(src) {
            document.getElementById('imageModal').style.display = 'flex';
            document.getElementById('imgFull').src = src;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>

</body>
</html>
