<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - ผลงานทั้งหมด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 40%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .full-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            border: 2px solid #ffffff;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            padding: 50px 40px;
        }

        .page-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff3366, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .section-header {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff3366;
            margin: 30px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 3px solid #ffe6ed;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
            min-height: 220px;
        }

        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 2px solid #ffccd5;
            aspect-ratio: 4 / 3;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gallery-item:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ff3366;
            box-shadow: 0 15px 30px rgba(255, 51, 102, 0.25);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ปุ่มสลับหน้าสำหรับกลุ่มพอด */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .page-btn {
            background: #ffffff;
            border: 2px solid #ff3366;
            color: #ff3366;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .page-btn.active, .page-btn:hover {
            background: #ff3366;
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-back {
            display: inline-block;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 16px 50px;
            border-radius: 50px;
            background: #ffffff;
            color: #ff3366;
            border: 3px solid #ff3366;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-back:hover {
            background: #ff3366;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 51, 102, 0.4);
        }

        /* Modal ซูมดูรูปใหญ่ */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .pod-page {
            display: none;
        }

        .pod-page.active {
            display: grid;
        }

        @media (max-width: 768px) {
            .full-wrapper { padding: 30px 15px; }
            .page-title { font-size: 2.5rem; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

    <div class="full-wrapper">
        <h1 class="page-title">MY PORTFOLIO</h1>

        <!-- โซนเกียรติบัตร (หน้าละ 6 ใบ) -->
        <div class="section-header">
            <span>📜 เกียรติบัตร (6 ใบ)</span>
        </div>
        <div class="gallery-grid">
            <div class="gallery-item" onclick="openModal('บัตร 1.jpg')"><img src="บัตร 1.jpg" alt="เกียรติบัตร 1"></div>
            <div class="gallery-item" onclick="openModal('บัตร 2.jpg')"><img src="บัตร 2.jpg" alt="เกียรติบัตร 2"></div>
            <div class="gallery-item" onclick="openModal('บัตร 4.jpg')"><img src="บัตร 4.jpg" alt="เกียรติบัตร 4"></div>
            <div class="gallery-item" onclick="openModal('บัตร 5.jpg')"><img src="บัตร 5.jpg" alt="เกียรติบัตร 5"></div>
            <div class="gallery-item" onclick="openModal('บัตร 6.jpg')"><img src="บัตร 6.jpg" alt="เกียรติบัตร 6"></div>
            <!-- หากมีเกียรติบัตรใบที่ 3 เพิ่มเติมสามารถใส่ชื่อไฟล์ตรงนี้ได้ครับ -->
            <div class="gallery-item" onclick="openModal('บัตร 3.jpg')"><img src="บัตร 3.jpg" alt="เกียรติบัตร 3" onerror="this.parentElement.style.display='none'"></div>
        </div>

        <!-- โซนผลงาน (20 ใบ แบ่งหน้าละ 5 ใบ) -->
        <div class="section-header">
            <span>🎨 ผลงานและกิจกรรม (20 ใบ)</span>
        </div>

        <!-- หน้าที่ 1 (พอด 1 - 5) -->
        <div class="gallery-grid pod-page active" id="pod-page-1">
            <div class="gallery-item" onclick="openModal('พอด 1.jpg')"><img src="พอด 1.jpg" alt="พอด 1"></div>
            <div class="gallery-item" onclick="openModal('พอด 2.jpg')"><img src="พอด 2.jpg" alt="พอด 2"></div>
            <div class="gallery-item" onclick="openModal('พอด 3.jpg')"><img src="พอด 3.jpg" alt="พอด 3"></div>
            <div class="gallery-item" onclick="openModal('พอด 4.jpg')"><img src="พอด 4.jpg" alt="พอด 4"></div>
            <div class="gallery-item" onclick="openModal('พอด 5.jpg')"><img src="พอด 5.jpg" alt="พอด 5"></div>
        </div>

        <!-- หน้าที่ 2 (พอด 6 - 10) -->
        <div class="gallery-grid pod-page" id="pod-page-2">
            <div class="gallery-item" onclick="openModal('พอด 6.jpg')"><img src="พอด 6.jpg" alt="พอด 6"></div>
            <div class="gallery-item" onclick="openModal('พอด 7.jpg')"><img src="พอด 7.jpg" alt="พอด 7"></div>
            <div class="gallery-item" onclick="openModal('พอด 8.jpg')"><img src="พอด 8.jpg" alt="พอด 8"></div>
            <div class="gallery-item" onclick="openModal('พอด 9.jpg')"><img src="พอด 9.jpg" alt="พอด 9"></div>
            <div class="gallery-item" onclick="openModal('พอด 10.jpg')"><img src="พอด 10.jpg" alt="พอด 10"></div>
        </div>

        <!-- หน้าที่ 3 (พอด 11 - 15) -->
        <div class="gallery-grid pod-page" id="pod-page-3">
            <div class="gallery-item" onclick="openModal('พอด 11.jpg')"><img src="พอด 11.jpg" alt="พอด 11"></div>
            <div class="gallery-item" onclick="openModal('พอด 12.jpg')"><img src="พอด 12.jpg" alt="พอด 12"></div>
            <div class="gallery-item" onclick="openModal('พอด 13.jpg')"><img src="พอด 13.jpg" alt="พอด 13"></div>
            <div class="gallery-item" onclick="openModal('พอด 14.jpg')"><img src="พอด 14.jpg" alt="พอด 14"></div>
            <div class="gallery-item" onclick="openModal('พอด 15.jpg')"><img src="พอด 15.jpg" alt="พอด 15"></div>
        </div>

        <!-- หน้าที่ 4 (พอด 16 - 20) -->
        <div class="gallery-grid pod-page" id="pod-page-4">
            <div class="gallery-item" onclick="openModal('พอด 16.jpg')"><img src="พอด 16.jpg" alt="พอด 16"></div>
            <div class="gallery-item" onclick="openModal('พอด 17.jpg')"><img src="พอด 17.jpg" alt="พอด 17"></div>
            <div class="gallery-item" onclick="openModal('พอด 18.jpg')"><img src="พอด 18.jpg" alt="พอด 18"></div>
            <div class="gallery-item" onclick="openModal('พอด 19.jpg')"><img src="พอด 19.jpg" alt="พอด 19"></div>
            <div class="gallery-item" onclick="openModal('พอด 20.jpg')"><img src="พอด 20.jpg" alt="พอด 20"></div>
        </div>

        <!-- ปุ่มกดเปลี่ยนหน้าพอด -->
        <div class="pagination">
            <button class="page-btn active" onclick="changePodPage(1)">หน้า 1 (1-5)</button>
            <button class="page-btn" onclick="changePodPage(2)">หน้า 2 (6-10)</button>
            <button class="page-btn" onclick="changePodPage(3)">หน้า 3 (11-15)</button>
            <button class="page-btn" onclick="changePodPage(4)">หน้า 4 (16-20)</button>
        </div>

        <div class="btn-group">
            <a href="about.html" class="btn-back">&larr; ย้อนกลับไปประวัติส่วนตัว</a>
        </div>
    </div>

    <!-- Modal ซูมภาพ -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-img" id="imgFull">
    </div>

    <script>
        function changePodPage(pageNum) {
            // ซ่อนทุกหน้าของพอด
            document.querySelectorAll('.pod-page').forEach(page => {
                page.classList.remove('active');
            });
            // เอาสถานะ active ออกจากปุ่มกด
            document.querySelectorAll('.page-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // แสดงหน้าที่เลือก
            document.getElementById('pod-page-' + pageNum).classList.add('active');
            // ไฮไลต์ปุ่มที่เลือก
            event.target.classList.add('active');
        }

        function openModal(src) {
            document.getElementById('imageModal').style.display = 'flex';
            document.getElementById('imgFull').src = src;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>

</body>
</html>
