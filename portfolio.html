<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - ผลงานของฉัน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 40%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .full-wrapper {
            width: 100%;
            max-width: 1250px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            border: 2px solid #ffffff;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            padding: 50px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px dashed #ff85a2;
        }

        .page-title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff3366, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-home-btn {
            text-decoration: none;
            background: #ff3366;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(255, 51, 102, 0.3);
            transition: all 0.3s ease;
        }

        .nav-home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 51, 102, 0.5);
        }

        /* ตารางแกลเลอรีรูปภาพใหญ่ 3 คอลัมน์ */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 45px;
        }

        .cert-card {
            background: #ffffff;
            border: 3px solid #ffccd5;
            border-radius: 25px;
            padding: 15px;
            height: 320px; /* ขนาดเกียรติบัตรใหญ่เต็มตา */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .cert-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: #ff3366;
            box-shadow: 0 20px 40px rgba(255, 51, 102, 0.3);
        }

        .cert-card img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
        }

        .btn-back {
            text-decoration: none;
            background: #ffffff;
            color: #ff3366;
            border: 3px solid #ff3366;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 15px 40px;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: #fff0f3;
            transform: translateY(-3px);
        }

        @media (max-width: 1000px) {
            .gallery-container { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 650px) {
            .gallery-container { grid-template-columns: 1fr; }
            .header-bar { flex-direction: column; gap: 15px; text-align: center; }
            .full-wrapper { padding: 30px 20px; }
            .page-title { font-size: 2.2rem; }
            .cert-card { height: 250px; }
        }
    </style>
</head>
<body>

    <div class="full-wrapper">
        <div class="header-bar">
            <h1 class="page-title">ผลงานของฉัน</h1>
            <a href="index.html" class="nav-home-btn">&larr; กลับหน้าแรก</a>
        </div>

        <div class="gallery-container">
            <div class="cert-card"><img src="IMG_0690.jpeg" alt="ผลงาน 1"></div>
            <div class="cert-card"><img src="IMG_0694.jpeg" alt="ผลงาน 2"></div>
            <div class="cert-card"><img src="IMG_0691.jpeg" alt="ผลงาน 3"></div>
            <div class="cert-card"><img src="IMG_0692.jpeg" alt="ผลงาน 4"></div>
            <div class="cert-card"><img src="IMG_0693.jpeg" alt="ผลงาน 5"></div>
        </div>

        <div class="btn-group">
            <a href="about.html" class="btn-back">&larr; ย้อนกลับไปหน้าประวัติส่วนตัว</a>
        </div>
    </div>

</body>
</html>
