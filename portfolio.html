<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - ผลงานทั้งหมด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #7928ca, #ff007f, #23d5ab, #23a6d5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .full-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.2);
            padding: 50px 40px;
            animation: cardAppear 1s ease-out;
        }

        .page-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .page-subtitle {
            text-align: center;
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 35px;
        }

        .gallery-grid {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 35px;
            min-height: 480px;
        }

        .gallery-grid.active {
            display: grid;
            animation: fadeIn 0.6s ease-in-out;
        }

        /* เอฟเฟกต์รูปภาพใน Gallery */
        .gallery-item {
            position: relative;
            border-radius: 25px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.8);
            aspect-ratio: 4 / 3;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gallery-item:hover {
            transform: translateY(-10px) scale(1.04) rotate(1deg);
            border-color: #ff007f;
            box-shadow: 0 20px 40px rgba(255, 0, 128, 0.4);
        }

        .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: #ffffff;
            border: 3px solid #ff007f;
            color: #ff007f;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .page-btn.active, .page-btn:hover {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(255, 0, 128, 0.4);
            transform: translateY(-3px);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-back {
            display: inline-block;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 16px 50px;
            border-radius: 50px;
            background: #ffffff;
            color: #ff007f;
            border: 3px solid #ff007f;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-back:hover {
            background: #ff007f;
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(255, 0, 128, 0.4);
        }

        /* Modal ซูมรูป */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.3);
            object-fit: contain;
            animation: zoomIn 0.3s ease;
        }

        .close-modal {
            position: absolute;
            top: 20px; right: 30px;
            color: #fff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .full-wrapper { padding: 30px 15px; }
            .page-title { font-size: 2.5rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        }

        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <!-- Modal ซูมภาพ -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-img" id="imgFull">
    </div>

    <script>
        function changePage(pageNum, evt) {
            document.querySelectorAll('.gallery-grid').forEach(grid => {
                grid.classList.remove('active');
            });
            document.querySelectorAll('.page-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById('page-' + pageNum).classList.add('active');
            evt.target.classList.add('active');
        }

        function openModal(src) {
            document.getElementById('imageModal').style.display = 'flex';
            document.getElementById('imgFull').src = src;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
