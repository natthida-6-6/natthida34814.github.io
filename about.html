<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - ประวัติส่วนตัว & งานอดิเรก</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* เอฟเฟกต์อนุภาคระยิบระยับ */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                        radial-gradient(3px 3px at 80px 120px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 150px 200px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: sparkle 4s linear infinite;
            z-index: 0;
        }

        .full-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 50px rgba(255, 0, 128, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.5);
            padding: 50px 40px;
            animation: cardAppear 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .page-title {
            font-size: 3.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .section-title {
            font-size: 2.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin: 50px 0 25px 0;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 100px;
            height: 5px;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            margin: 10px auto 0;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }

        .grid-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 20px;
        }

        /* การ์ดข้อมูลโฮเวอร์ 3D ลอยเรืองแสง */
        .card-info {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #ffccd5;
            border-radius: 25px;
            padding: 25px 30px;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .card-info:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ff007f;
            box-shadow: 0 20px 40px rgba(255, 0, 128, 0.3);
            background: #ffffff;
        }

        .card-info.full-width {
            grid-column: span 2;
            background: linear-gradient(135deg, #ffe6ed 0%, #ffffff 100%);
            border-color: #ff85a2;
        }

        .card-info.full-width:hover {
            box-shadow: 0 20px 40px rgba(255, 0, 128, 0.35);
        }

        .label {
            font-size: 1.15rem;
            color: #ff007f;
            font-weight: 800;
            margin-bottom: 8px;
            display: block;
        }

        .value {
            font-size: 1.35rem;
            color: #2c2c2c;
            font-weight: 600;
            line-height: 1.5;
        }

        /* สไตล์สำหรับส่วนข้อมูลการติดต่อที่เพิ่มเข้ามา */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #2c2c2c;
        }

        .contact-item i {
            font-size: 1.8rem;
            width: 35px;
            text-align: center;
        }

        .contact-item .fa-phone { color: #000000; }
        .contact-item .fa-facebook { color: #1877f2; }
        .contact-item .fa-instagram { color: #e4405f; }
        .contact-item .fa-line { color: #00b900; }

        /* สไตล์สำหรับส่วนทักษะที่เพิ่มเข้ามา */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .skill-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.8);
            padding: 12px 18px;
            border-radius: 15px;
            border: 1px solid #ffd1dc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            font-weight: 600;
            font-size: 1.1rem;
            color: #333;
        }

        .skill-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            object-fit: contain;
        }

        /* ส่วนแสดงผลงานอดิเรก */
        .hobby-section {
            background: rgba(255, 240, 245, 0.7);
            backdrop-filter: blur(10px);
            border: 2px dashed #ff007f;
            border-radius: 30px;
            padding: 30px 20px;
            margin-top: 20px;
            margin-bottom: 40px;
            box-shadow: inset 0 0 15px rgba(255, 0, 128, 0.1);
        }

        .gallery-grid {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .gallery-grid.active {
            display: grid;
            animation: fadeIn 0.5s ease-in-out;
        }

        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 3px solid rgba(255, 255, 255, 0.9);
            aspect-ratio: 4 / 3;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gallery-item:hover {
            transform: translateY(-8px) scale(1.03) rotate(1deg);
            border-color: #ff007f;
            box-shadow: 0 20px 35px rgba(255, 0, 128, 0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        /* ปุ่มสลับหน้างานอดิเรก */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: #ffffff;
            border: 2px solid #ff007f;
            color: #ff007f;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .page-btn.active, .page-btn:hover {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(255, 0, 128, 0.4);
            transform: translateY(-3px);
        }

        /* ปุ่มนำทางท้ายหน้าสุดอลังการ */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 18px 45px;
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            flex: 1;
            max-width: 320px;
            position: relative;
            overflow: hidden;
        }

        .btn-back {
            background: #ffffff;
            color: #ff007f;
            border: 3px solid #ff007f;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .btn-back:hover {
            background: #ff007f;
            color: #ffffff;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 0, 128, 0.4);
        }

        .btn-next {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #ffffff;
            border: 2px solid #ffffff;
            box-shadow: 0 10px 25px rgba(121, 40, 202, 0.4);
        }

        .btn-next:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 20px 40px rgba(255, 0, 128, 0.6);
            letter-spacing: 1px;
        }

        /* Modal ซูมภาพ */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
            object-fit: contain;
            animation: zoomIn 0.3s ease;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Keyframes แอนิเมชัน */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div class="full-wrapper">
        <h1 class="page-title">About Me</h1>

        <!-- ส่วนประวัติส่วนตัว -->
        <h2 class="section-title">ประวัติส่วนตัว</h2>
        <div class="grid-info">

        <!-- เพิ่มส่วนข้อมูลการติดต่อ -->
        <h2 class="section-title">ข้อมูลการติดต่อ</h2>
        <div class="card-info full-width" style="margin-bottom: 25px;">
            <div class="contact-list">
                <div class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>095-543-6280</span>
                </div>
                <div class="contact-item">
                    <i class="fa-brands fa-facebook"></i>
                    <span>ณัฐธิดา ถกลพัฒนกุล</span>
                </div>
                <div class="contact-item">
                    <i class="fa-brands fa-instagram"></i>
                    <span>nammook__k</span>
                </div>
                <div class="contact-item">
                    <i class="fa-brands fa-line"></i>
                    <span>nammok...</span>

            </div>
        </div>

        <!-- เพิ่มส่วนทักษะ -->
        <h2 class="section-title">ทักษะ</h2>
        <div class="card-info full-width" style="margin-bottom: 25px;">
            <div class="skills-grid">
                <div class="skill-item">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Ibis_Paint_X_logo.png/600px-Ibis_Paint_X_logo.png" alt="Ibis Paint" class="skill-icon">

                <div class="skill-item">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/47/Autodesk_3ds_Max_logo.svg" alt="3ds Max" class="skill-icon">
                    <span>Autodesk 3ds Max</span>
                </div>
                <div class="skill-item">
                    <img src="https://play-lh.googleusercontent.com/38N3-98x1J5I51N8hE1_Lq4s57x7XN1J448r_v4N2g3" alt="GoPaint" class="skill-icon">

                <div class="skill-item">

                </div>
                <div class="skill-item">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/0c/Blender_logo_no_text.svg" alt="Blender" class="skill-icon">

                </div>
            </div>
        </div>

    </div>

</body>
</html>
