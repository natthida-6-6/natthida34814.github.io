<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว - About Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #23d5ab, #23a6d5, #e73c7e, #ee7752);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.2);
            padding: 50px 40px;
            animation: cardAppear 1s ease-out;
        }

        .header-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .info-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 25px;
            border-left: 6px solid #ff007f;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .info-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 35px rgba(255, 0, 128, 0.25);
            border-left-color: #7928ca;
        }

        .info-card h3 {
            color: #ff007f;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .info-card p {
            color: #333;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 16px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .btn-prev {
            background: #ffffff;
            color: #ff007f;
            border: 3px solid #ff007f;
        }

        .btn-prev:hover {
            background: #ff007f;
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(255, 0, 128, 0.3);
        }

        .btn-next {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #ffffff;
            border: none;
            box-shadow: 0 10px 25px rgba(121, 40, 202, 0.3);
        }

        .btn-next:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 0, 128, 0.5);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title">PROFILE INFO</h1>

        <div class="info-grid">
            <div class="info-card">
                <h3>ชื่อ-นามสกุล</h3>
                <p>นางสาว ณัฐธิดา ถกลพัฒนกุล</p>
            </div>
            <div class="info-card">
                <h3>ชื่อเล่น</h3>
                <p>มุก</p>
            </div>
            <div class="info-card">
                <h3>สถานศึกษา</h3>
                <p>โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</p>
            </div>
            <div class="info-card">
                <h3>แผนการเรียน</h3>
                <p>ศิลป์-คำนวณ / คอมพิวเตอร์</p>
            </div>
            <div class="info-card">
                <h3>งานอดิเรก</h3>
                <p>ฟังเพลง / ออกแบบ / เขียนโค้ด</p>
            </div>
            <div class="info-card">
                <h3>คติประจำใจ</h3>
                <p>ความพยายามไม่เคยทำร้ายคนที่ตั้งใจจริง</p>
            </div>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn btn-prev">&larr; ย้อนกลับหน้าแรก</a>
            <a href="portfolio.html" class="btn btn-next">ชมผลงานทั้งหมด &rarr;</a>
        </div>
    </div>

</body>
</html>
