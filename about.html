<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - ประวัติส่วนตัว</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 40%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 50px 40px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 20px 50px rgba(216, 27, 96, 0.25);
            border: 2px solid #ffccd5;
        }

        .page-title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d81b60, #8e24aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .info-card {
            background: #ffffff;
            border: 2px solid #ffccd5;
            border-radius: 20px;
            padding: 22px 25px;
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.08);
            transition: all 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            border-color: #ff4081;
            box-shadow: 0 12px 25px rgba(216, 27, 96, 0.18);
        }

        .info-label {
            color: #d81b60;
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 6px;
            display: block;
        }

        .info-value {
            color: #2c2c2c;
            font-weight: 500;
            font-size: 1.2rem;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        .btn-secondary {
            background: #ffffff;
            color: #d81b60;
            border: 3px solid #ff85a2;
        }

        .btn-secondary:hover {
            background: #fff0f3;
            transform: translateY(-3px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff4081, #d81b60);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(216, 27, 96, 0.5);
        }

        @media (max-width: 700px) {
            .info-grid { grid-template-columns: 1fr; }
            .container { padding: 35px 20px; }
            .page-title { font-size: 2.3rem; }
            .btn { width: 100%; flex: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="page-title">ABOUT ME</h1>

        <div class="info-grid">
            <div class="info-card">
                <span class="info-label">👤 ชื่อ-นามสกุล</span>
                <span class="info-value">นางสาว ณัฐธิดา ถกลพัฒนกุล</span>
            </div>
            <div class="info-card">
                <span class="info-label">🏫 โรงเรียน</span>
                <span class="info-value">บ้านบึง "อุตสาหกรรมนุเคราะห์"</span>
            </div>
            <div class="info-card">
                <span class="info-label">🇹🇭 เชื้อชาติ / สัญชาติ</span>
                <span class="info-value">ไทย / ไทย</span>
            </div>
            <div class="info-card">
                <span class="info-label">พุทธ ศาสนา</span>
                <span class="info-value">พุทธ</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn btn-secondary">&larr; ย้อนกลับหน้าแรก</a>
            <a href="portfolio.html" class="btn btn-primary">เข้าดูผลงาน &rarr;</a>
        </div>
    </div>

</body>
</html>
